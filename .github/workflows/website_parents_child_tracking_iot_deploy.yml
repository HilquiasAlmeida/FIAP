name: Deploy Website - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/web/**'
      - '.github/workflows/website_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Website using Exact Path
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          
          # Caminho exato fornecido por você
          WEB_DIR="$WORKSPACE_DIR/Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/web"
          
          if [ ! -d "$WEB_DIR" ]; then
            echo "Erro: O diretório do website não foi encontrado em $WEB_DIR"
            exit 1
          fi
          
          echo "Pasta web encontrada com sucesso em: $WEB_DIR"

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          cd "$WORKSPACE_DIR"
          mkdir -p temp_gh_pages_web
          cd temp_gh_pages_web

          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . || \
          ( git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git )

          git checkout gh-pages || git checkout -b gh-pages

          # Prepara a subpasta exata no GitHub Pages
          mkdir -p family-trackings/website
          rm -rf family-trackings/website/*

          # 1. Copia toda a estrutura original mantendo o projeto Django intacto
          cp -r "$WEB_DIR"/* family-trackings/website/

          # 2. Extrai e posiciona o index.html na raiz do site do GitHub Pages usando o novo caminho (parents_tracker)
          INDEX_PATH="$WEB_DIR/family_project/parents_tracker/templates/tracker/index.html"
          
          if [ -f "$INDEX_PATH" ]; then
            cp "$INDEX_PATH" family-trackings/website/index.html
            
            # Ajusta automaticamente as tags do Django para os novos caminhos estáticos da pasta parents_tracker
            sed -i 's/{% load static %}//g' family-trackings/website/index.html
            sed -i "s/{% static 'css\/style.css' %}/family_project\/parents_tracker\/static\/css\/style.css/g" family-trackings/website/index.html
            sed -i "s/{% static 'js\/script.js' %}/family_project\/parents_tracker\/static\/js\/script.js/g" family-trackings/website/index.html
          else
            echo "Aviso: index.html não foi encontrado no caminho especificado: $INDEX_PATH"
          fi

          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy automático: Ajustando rotas para a estrutura parents_tracker [skip ci]"
            git push origin gh-pages
            echo "===================================================="
            echo "🌐 WEBSITE PUBLICADO COM SUCESSO!"
            echo "🔗 Link: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/family-trackings/website/"
            echo "===================================================="
          else
            echo "Nenhuma alteração detectada para o website."
          fi
