name: Deploy Website - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/web/**'
      - '.github/workflows/website_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Build and Prepare Website Files
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          WEB_DIR="$WORKSPACE_DIR/Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/web"
          
          if [ ! -d "$WEB_DIR" ]; then
            echo "Erro: O diretório do website não foi encontrado em $WEB_DIR"
            exit 1
          fi
          
          echo "Pasta web encontrada com sucesso em: $WEB_DIR"
          
          # Cria a pasta de build local no runner
          mkdir -p "$WORKSPACE_DIR/build_output/family-trackings/website"
          cp -r "$WEB_DIR"/* "$WORKSPACE_DIR/build_output/family-trackings/website/"
          
          # Caminho exato do index.html na nova estrutura
          INDEX_PATH="$WEB_DIR/family_project/parents_tracker/templates/tracker/index.html"
          
          if [ -f "$INDEX_PATH" ]; then
            cp "$INDEX_PATH" "$WORKSPACE_DIR/build_output/family-trackings/website/index.html"
            
            # Ajusta automaticamente as tags do Django para links estáticos funcionarem no GitHub Pages
            sed -i 's/{% load static %}//g' "$WORKSPACE_DIR/build_output/family-trackings/website/index.html"
            sed -i "s/{% static 'css\/style.css' %}/family_project\/parents_tracker\/static\/css\/style.css/g" "$WORKSPACE_DIR/build_output/family-trackings/website/index.html"
            sed -i "s/{% static 'js\/script.js' %}/family_project\/parents_tracker\/static\/js\/script.js/g" "$WORKSPACE_DIR/build_output/family-trackings/website/index.html"
            
            # Garante que links relativos antigos (como ../app/) apontem para os lugares certos se existirem
            sed -i 's/href="\.\.\/app\/"/href="#app"/g' "$WORKSPACE_DIR/build_output/family-trackings/website/index.html"
            sed -i 's/href="\.\.\/system\/"/href="#system"/g' "$WORKSPACE_DIR/build_output/family-trackings/website/index.html"
            
            echo "✅ Build concluído: Links e assets corrigidos com sucesso!"
          else
            echo "Aviso: index.html não foi encontrado no caminho: $INDEX_PATH"
          fi

      - name: 3. Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          cd "$WORKSPACE_DIR"
          mkdir -p temp_gh_pages_web
          cd temp_gh_pages_web

          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . || \
          ( git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git )

          git checkout gh-pages || git checkout -b gh-pages

          mkdir -p family-trackings/website
          rm -rf family-trackings/website/*
          cp -r "$WORKSPACE_DIR/build_output/family-trackings/website/"* family-trackings/website/

          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy automático: Links e assets ajustados para o GitHub Pages [skip ci]"
            git push origin gh-pages
            
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/family-trackings/website/"
            
            echo "===================================================="
            echo "🌐 WEBSITE PUBLICADO COM SUCESSO!"
            echo "🔗 Link: $SITE_URL"
            echo "===================================================="
            
            echo "### 🚀 Deploy Realizado com Sucesso!" >> $GITHUB_STEP_SUMMARY
            echo "O build e o deploy do site do projeto FIAP foram concluídos." >> $GITHUB_STEP_SUMMARY
            echo "👉 **[Clique aqui para acessar a página do projeto]($SITE_URL)**" >> $GITHUB_STEP_SUMMARY
          else
            echo "Nenhuma alteração detectada para o website."
          fi
