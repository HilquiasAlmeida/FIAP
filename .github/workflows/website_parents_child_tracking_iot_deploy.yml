name: Deploy Website - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/**'
      - '.github/workflows/website_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- ETAPA 1: BUILD ---
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Build and Prepare Website & App Files
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          PROJECT_ROOT="$WORKSPACE_DIR/Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot"
          WEB_DIR="$PROJECT_ROOT/web"
          APP_DIR="$PROJECT_ROOT/app"
          
          if [ ! -d "$WEB_DIR" ]; then
            echo "Erro: O diretório do website não foi encontrado em $WEB_DIR"
            exit 1
          fi
          
          echo "📂 Organizando arquivos para publicação..."
          mkdir -p "$WORKSPACE_DIR/build_output/family-trackings/website"
          
          # Copia o conteúdo da web
          cp -r "$WEB_DIR"/* "$WORKSPACE_DIR/build_output/family-trackings/website/"
          
          # Copia a pasta app (com o main.py)
          if [ -d "$APP_DIR" ]; then
            mkdir -p "$WORKSPACE_DIR/build_output/family-trackings/website/app"
            cp -r "$APP_DIR"/* "$WORKSPACE_DIR/build_output/family-trackings/website/app/"
            echo "✅ Pasta app integrada ao site com sucesso!"
          fi

          echo "✅ Build completo concluído!"

      - name: 3. Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: build_output/family-trackings/website/

  # --- ETAPA 2: DEPLOY WEBSITE ---
  deploy-website:
    needs: build
    name: deploy website
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download Website Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-files
          path: build_output/family-trackings/website/

      - name: 3. Deploy to GitHub Pages (Clean Root)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          cd "$WORKSPACE_DIR"
          mkdir -p temp_gh_pages_web
          cd temp_gh_pages_web

          # Clona a branch gh-pages
          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . || \
          ( git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git )

          git checkout gh-pages || git checkout -b gh-pages

          # 🧹 LIMPEZA TOTAL DA RAIZ: Remove absolutamente TUDO na branch gh-pages, exceto o .git
          echo "🧹 Removendo arquivos residuais antigos da raiz..."
          find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +

          # Recria a estrutura limpa com os arquivos novos
          mkdir -p family-trackings/website
          cp -r "$WORKSPACE_DIR/build_output/family-trackings/website/"* family-trackings/website/

          # Cria o novo index.html de redirecionamento limpo na raiz
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=family-trackings/website/">
              <title>Redirecionando para family-trackings...</title>
          </head>
          <body>
              <p>Redirecionando para o projeto <a href="family-trackings/website/">family-trackings</a>...</p>
          </body>
          </html>
          EOF

          git add -A
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy limpo: Eliminação de arquivos antigos da FIAP e atualização [skip ci]"
            git push origin gh-pages
            echo "✅ Branch gh-pages limpa e atualizada com sucesso!"
          else
            echo "ℹ️ Nenhuma alteração detectada."
          fi

          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/family-trackings/website/"
          
          echo "===================================================="
          echo "🌐 URL DO PROJETO:"
          echo "🔗 $SITE_URL"
          echo "===================================================="
