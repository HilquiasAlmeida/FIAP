name: Deploy Website - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Automation/family-trackings/website/**'
      - '.github/workflows/website_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Website to gh-pages (Isolated)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Garante que a pasta de origem existe e tem um index.html básico
          SRC_DIR="Automation/family-trackings/website"
          mkdir -p "$SRC_DIR"
          if [ ! -f "$SRC_DIR/index.html" ]; then
            echo "<h1 style='font-family:Arial;'>Website - Family Trackings</h1>" > "$SRC_DIR/index.html"
          fi

          # Clona apenas a branch gh-pages para uma pasta temporária (ou cria se não existir)
          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh_pages_branch || \
          ( mkdir gh_pages_branch && cd gh_pages_branch && git init && git checkout -b gh-pages && cd .. )

          cd gh_pages_branch
          git remote remove origin || true
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout gh-pages || git checkout -b gh-pages

          # Prepara a subpasta específica do website sem afetar as outras
          mkdir -p family-trackings/website
          rm -rf family-trackings/website/*

          # Copia os arquivos novos do site
          cp -r ../$SRC_DIR/* family-trackings/website/

          # Verifica se houve mudanças e faz o commit/push isolado
          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy independente: Atualizando website do family-trackings [skip ci]"
            git push origin gh-pages
          else
            echo "Nenhuma alteração detectada para o website."
          fi
