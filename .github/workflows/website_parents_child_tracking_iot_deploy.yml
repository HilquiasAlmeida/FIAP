name: Deploy Website - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/**'
      - '.github/workflows/website_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- ETAPA 1: BUILD (Adaptado para estrutura Django) ---
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Build and Prepare Website & App Files
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          PROJECT_ROOT="$WORKSPACE_DIR/Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot"
          WEB_DIR="$PROJECT_ROOT/web"
          TRACKER_DIR="$WEB_DIR/family_project/parents_tracker"
          APP_DIR="$PROJECT_ROOT/app"
          
          if [ ! -d "$TRACKER_DIR" ]; then
            echo "Erro: O diretório do tracker não foi encontrado em $TRACKER_DIR"
            exit 1
          fi
          
          echo "📂 Organizando arquivos do Django para publicação estática..."
          SITE_OUT="$WORKSPACE_DIR/build_output/family-trackings/website"
          mkdir -p "$SITE_OUT"
          
          # 1. Copia todos os templates HTML (index.html, arquitetura, demonstração, etc.) para a raiz do site
          if [ -d "$TRACKER_DIR/templates/tracker" ]; then
            cp -r "$TRACKER_DIR/templates/tracker"/* "$SITE_OUT/"
            echo "✅ Templates HTML copiados com sucesso!"
          fi
          
          # 2. Copia os arquivos estáticos (CSS, JS) para a pasta assets do site
          if [ -d "$TRACKER_DIR/static/assets" ]; then
            mkdir -p "$SITE_OUT/assets"
            cp -r "$TRACKER_DIR/static/assets"/* "$SITE_OUT/assets/"
            echo "✅ Arquivos estáticos (CSS/JS) copiados com sucesso!"
          fi
          
          # 3. Copia a pasta app (com o main.py) se existir
          if [ -d "$APP_DIR" ]; then
            mkdir -p "$SITE_OUT/app"
            cp -r "$APP_DIR"/* "$SITE_OUT/app/"
            echo "✅ Pasta app integrada ao site com sucesso!"
          fi

          echo "✅ Build completo concluído!"

      - name: 3. Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: build_output/family-trackings/website/

  # --- ETAPA 2: DEPLOY WEBSITE ---
  deploy-website:
    needs: build
    name: deploy website
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Download Website Artifact
        uses: actions/download-artifact@v4
        with:
          name: website-files
          path: build_output/family-trackings/website/

      - name: 3. Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          cd "$WORKSPACE_DIR"
          mkdir -p temp_gh_pages_web
          cd temp_gh_pages_web

          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . || \
          ( git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git )

          git checkout gh-pages || git checkout -b gh-pages

          # 🧹 LIMPEZA SEGURA DA RAIZ: Remove lixo antigo da FIAP da raiz, 
          # mas MANTÉM preservadas as pastas dos outros workflows (system e app-mobile)
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'family-trackings' -exec rm -rf {} +

          # Atualiza os arquivos do projeto na pasta correta
          mkdir -p family-trackings/website
          rm -rf family-trackings/website/*
          cp -r "$WORKSPACE_DIR/build_output/family-trackings/website/"* family-trackings/website/

          # 🚀 CRIAÇÃO DO .NOJEKYLL (Evita bloqueio de pastas internas)
          touch .nojekyll

          # 🚀 REDIRECIONAMENTO INTELIGENTE NA RAIZ LIMPA
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=family-trackings/website/">
              <title>Redirecionando para family-trackings...</title>
          </head>
          <body>
              <p>Redirecionando para o projeto <a href="family-trackings/website/">family-trackings</a>...</p>
          </body>
          </html>
          EOF

          git add -A
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy limpo: Ajuste para estrutura Django e redirecionamento [skip ci]"
            git push origin gh-pages
            echo "✅ Alterações enviadas com sucesso para o GitHub Pages!"
          else
            echo "ℹ️ Nenhuma alteração nova detectada."
          fi

          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/family-trackings/website/"
          
          echo "===================================================="
          echo "🌐 WEBSITE E CÓDIGO DISPONÍVEIS NO AR!"
          echo "🔗 Link: $SITE_URL"
          echo "===================================================="
          
          echo "## 🚀 Realizado com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "O site Django foi adaptado e publicado." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Clique aqui para acessar o projeto]($SITE_URL)**" >> $GITHUB_STEP_SUMMARY
