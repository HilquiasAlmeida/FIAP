name: Deploy App Mobile - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/**'
      - '.github/workflows/app_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build and Deploy App Mobile (Unified Step)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          
          # Localiza o requirements.txt com precisão
          REQ_FILE="$WORKSPACE_DIR/Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/requirements.txt"
          if [ ! -f "$REQ_FILE" ]; then
            REQ_FILE=$(find "$WORKSPACE_DIR" -name "requirements.txt" | grep "app" | head -n 1)
          fi
          
          if [ -z "$REQ_FILE" ] || [ ! -f "$REQ_FILE" ]; then
            echo "Erro: requirements.txt não encontrado!"
            exit 1
          fi

          APP_DIR=$(dirname "$REQ_FILE")
          echo "Pasta do app encontrada em: $APP_DIR"

          # Instala dependências
          python -m pip install --upgrade pip
          python -m pip install -r "$REQ_FILE"
          
          # Compila o app Flet para Web (WASM)
          cd "$APP_DIR"
          flet build web --yes --base-url /FIAP/family-trackings/app-mobile/

          # Confirma o local exato da build gerada
          BUILD_DIR="$APP_DIR/build/web"
          if [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR=$(find "$APP_DIR" -type d -name "web" | grep "build" | head -n 1)
          fi

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Erro crítico: A pasta build/web não foi localizada após o build!"
            exit 1
          fi

          echo "Caminho da build confirmado: $BUILD_DIR"

          # Configura o Git e realiza o deploy isolado para o gh-pages
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          cd "$WORKSPACE_DIR"
          mkdir -p temp_gh_pages_app
          cd temp_gh_pages_app

          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . || \
          ( git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git )

          git checkout gh-pages || git checkout -b gh-pages

          mkdir -p family-trackings/app-mobile
          rm -rf family-trackings/app-mobile/*
          cp -r "$BUILD_DIR"/* family-trackings/app-mobile/

          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy independente: Atualizando app-mobile [skip ci]"
            git push origin gh-pages
            echo "===================================================="
            echo "📱 APP MOBILE PUBLICADO COM SUCESSO!"
            echo "🔗 Link: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/family-trackings/app-mobile/"
            echo "===================================================="
          else
            echo "Nenhuma alteração detectada para o app mobile."
          fi
