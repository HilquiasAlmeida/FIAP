name: Deploy App Mobile - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/**'
      - '.github/workflows/app_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build Flet Web App and Prepare Artifact
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          REQ_FILE="$WORKSPACE_DIR/Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/requirements.txt"
          
          if [ ! -f "$REQ_FILE" ]; then
            REQ_FILE=$(find "$WORKSPACE_DIR" -name "requirements.txt" | grep "app" | head -n 1)
          fi
          
          if [ -z "$REQ_FILE" ] || [ ! -f "$REQ_FILE" ]; then
            echo "Erro: requirements.txt não encontrado!"
            exit 1
          fi

          APP_DIR=$(dirname "$REQ_FILE")
          echo "Pasta do app encontrada em: $APP_DIR"

          python -m pip install --upgrade pip
          python -m pip install -r "$REQ_FILE"
          
          cd "$APP_DIR"
          flet build web --yes --base-url /FIAP/family-trackings/app-mobile/

          BUILD_SRC="build/web"
          if [ ! -d "$BUILD_SRC" ]; then
            BUILD_SRC=$(find . -type d -name "web" | grep "build" | head -n 1)
          fi

          if [ ! -d "$BUILD_SRC" ]; then
            echo "Erro crítico: A pasta build/web não foi localizada!"
            exit 1
          fi

          # Truque essencial para o GitHub Pages não dar erro em rotas do Flet
          if [ -f "$BUILD_SRC/index.html" ]; then
            cp "$BUILD_SRC/index.html" "$BUILD_SRC/404.html"
            echo "Arquivo 404.html gerado com sucesso para suporte a rotas SPA."
          fi

          mkdir -p "$WORKSPACE_DIR/dist_mobile"
          cp -r "$BUILD_SRC"/* "$WORKSPACE_DIR/dist_mobile/"

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-mobile-build
          path: dist_mobile/

  deploy-mobile:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-mobile-build
          path: temp_build_output

      - name: Push to gh-pages branch (Isolated)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          BUILD_DIR="$WORKSPACE_DIR/temp_build_output"

          if [ ! -d "$BUILD_DIR" ]; then
            echo "Erro crítico: A pasta de build baixada não foi encontrada!"
            exit 1
          fi

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          cd "$WORKSPACE_DIR"
          mkdir -p temp_gh_pages_app
          cd temp_gh_pages_app

          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . || \
          ( git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git )

          git checkout gh-pages || git checkout -b gh-pages

          mkdir -p family-trackings/app-mobile
          rm -rf family-trackings/app-mobile/*
          cp -r "$BUILD_DIR"/* family-trackings/app-mobile/

          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy independente: Atualizando app-mobile [skip ci]"
            git push origin gh-pages
            echo "Alterações enviadas com sucesso para o GitHub Pages."
          else
            echo "Nenhuma alteração detectada no código do app mobile (branch já atualizada)."
          fi

          # Adiciona o link de acesso diretamente na página de resumo do GitHub Actions
          echo "### 📱 APP MOBILE PUBLICADO COM SUCESSO!" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [Acessar App Mobile Online](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/family-trackings/app-mobile/)" >> $GITHUB_STEP_SUMMARY
