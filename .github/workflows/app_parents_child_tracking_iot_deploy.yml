name: Deploy Flet Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/parents-child-tracking-iot/app/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Flet Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies & Build Flet Web
        run: |
          cd Computer-Engineering/Projects/Python/Automation/parents-child-tracking-iot/app
          pip install --upgrade pip
          pip install -r requirements.txt
          flet build web --yes
          sed -i 's|<base href="/">|<base href="/FIAP/">|g' build/web/index.html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Computer-Engineering/Projects/Python/Automation/parents-child-tracking-iot/app/build/web'
          name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
