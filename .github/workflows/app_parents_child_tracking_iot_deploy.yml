name: Deploy App Mobile - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/**'
      - '.github/workflows/app_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build Flet Web App
        run: |
          REQ_FILE=$(find . -path "*/parents-child-tracking-iot/*/requirements.txt" | head -n 1)
          if [ -z "$REQ_FILE" ]; then
            REQ_FILE=$(find . -name "requirements.txt" | grep "app" | head -n 1)
          fi
          if [ -z "$REQ_FILE" ]; then
            echo "Erro: requirements.txt não encontrado!"
            exit 1
          fi

          APP_DIR=$(dirname "$REQ_FILE")
          echo "Pasta do app encontrada em: $APP_DIR"

          python -m pip install --upgrade pip
          python -m pip install -r "$REQ_FILE"
          
          cd "$APP_DIR"
          flet build web --yes --base-url /FIAP/family-trackings/app-mobile/

      - name: Push to gh-pages branch (Isolated)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Define caminhos absolutos baseados no workspace do GitHub
          WORKSPACE_DIR="$GITHUB_WORKSPACE"
          BUILD_DIR="$WORKSPACE_DIR/Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/build/web"

          if [ ! -d "$BUILD_DIR" ]; then
            BUILD_DIR=$(find "$WORKSPACE_DIR" -type d -path "*/parents-child-tracking-iot/app/build/web" | head -n 1)
          fi

          echo "Caminho absoluto da build: $BUILD_DIR"

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Prepara diretório isolado fora do caminho de compilação
          cd "$WORKSPACE_DIR"
          mkdir -p temp_gh_pages
          cd temp_gh_pages

          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . || \
          ( git init && git checkout -b gh-pages && git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git )

          git checkout gh-pages || git checkout -b gh-pages

          # Copia os arquivos usando o caminho absoluto correto
          mkdir -p family-trackings/app-mobile
          rm -rf family-trackings/app-mobile/*

          if [ -d "$BUILD_DIR" ]; then
            cp -r "$BUILD_DIR"/* family-trackings/app-mobile/
          else
            echo "Erro crítico: A pasta build/web não foi localizada!"
            exit 1
          fi

          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy independente: Atualizando app-mobile [skip ci]"
            git push origin gh-pages
          else
            echo "Nenhuma alteração detectada para o app mobile."
          fi
