name: Deploy App Mobile - Family Trackings

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/**'
      - '.github/workflows/app_parents_child_tracking_iot_deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build Flet Web App
        run: |
          APP_DIR="Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app"
          
          python -m pip install --upgrade pip
          python -m pip install -r "$APP_DIR/requirements.txt"
          
          cd "$APP_DIR"
          flet build web --yes --base-url /FIAP/family-trackings/app-mobile/

      - name: Push to gh-pages branch (Isolated)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          SRC_BUILD="Computer-Engineering/Projects/Python/Automation/family-trackings/parents-child-tracking-iot/app/build/web"

          git clone --branch gh-pages --single-branch https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh_pages_branch || \
          ( mkdir gh_pages_branch && cd gh_pages_branch && git init && git checkout -b gh-pages && cd .. )

          cd gh_pages_branch
          git remote remove origin || true
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout gh-pages || git checkout -b gh-pages

          mkdir -p family-trackings/app-mobile
          rm -rf family-trackings/app-mobile/*
          cp -r ../$SRC_BUILD/* family-trackings/app-mobile/

          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "Deploy independente: Atualizando app-mobile [skip ci]"
            git push origin gh-pages
          else
            echo "Nenhuma alteração detectada para o app mobile."
          fi
