<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Trackings - System Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; border: 1px solid #334155; }
        .login-card h2 { margin-bottom: 8px; color: #38bdf8; font-size: 24px; text-align: center; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; text-align: center; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
        .input-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 14px; }
        .input-group input:focus { outline: none; border-color: #38bdf8; }
        .btn-submit { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 6px; color: #0f172a; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
        .btn-submit:hover { background: #0ea5e9; }
        .info-box { margin-top: 20px; font-size: 12px; color: #64748b; text-align: center; background: #0f172a; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>System Core Login</h2>
        <p>Acesso Restrito - Painel Administrativo</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Usuário Administrador</label>
                <input type="text" id="username" value="admin_system" required>
            </div>
            <div class="input-group">
                <label>Chave de Acesso / Senha</label>
                <input type="password" id="password" value="********" required>
            </div>
            <button type="submit" class="btn-submit">Acessar Dashboard Core</button>
        </form>

        <div class="info-box">
            💡 <strong>Modo Demonstração GitHub Pages:</strong> Clique em acessar para testar a interface simulada.
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            // Redireciona para o dashboard avançado simulado
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
