<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - System IoT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 30px; }
        .dashboard { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; font-size: 1.8rem; color: #00d2d3; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #162447; padding: 20px; border-radius: 10px; border-left: 4px solid #00d2d3; }
        .card h3 { margin-top: 0; color: #e4e4e4; }
        .status { color: #2ed573; font-weight: bold; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Painel IoT - System Control</h1>
            <span>Status: <span class="status">Online (Operacional)</span></span>
        </header>
        
        <div class="card-grid">
            <div class="card">
                <h3>Dispositivo ESP32</h3>
                <p>Conexão Wi-Fi: Estabelecida</p>
                <p>Último sinal: Há poucos segundos</p>
            </div>
            <div class="card" style="border-left-color: #ff4757;">
                <h3>Alertas de Rastreio</h3>
                <p>Nenhuma ocorrência crítica registrada no momento.</p>
            </div>
        </div>
    </div>
</body>
</html>
