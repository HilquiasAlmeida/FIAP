<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Trackings - IoT</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 40px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; font-size: 1.1rem; line-height: 1.6; }
        .badge { display: inline-block; background: #3498db; color: white; padding: 6px 15px; border-radius: 20px; font-size: 0.9rem; margin-bottom: 20px; }
        .links { margin-top: 30px; }
        .btn { display: inline-block; background: #2ecc71; color: white; padding: 12px 25px; border-radius: 6px; text-decoration: none; font-weight: bold; transition: background 0.3s; margin: 5px; }
        .btn:hover { background: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Projeto FIAP - Automação & IoT</span>
        <h1>Family Trackings</h1>
        <p>Sistema inteligente de rastreamento e monitoramento familiar integrado com dispositivos embarcados (ESP32) e aplicações multiplataforma.</p>
        
        <div class="links">
            <a href="../app/" class="btn">Acessar App Mobile</a>
            <a href="../system/" class="btn" style="background: #e67e22;">Acessar Painel do Sistema</a>
        </div>
    </div>
</body>
</html>
